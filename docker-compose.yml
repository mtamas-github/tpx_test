services:
  api:
    build: ./backend
    environment:
      DATABASE_PATH: /data/urlshortener.db
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - url-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/urls?size=1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  url-data:
